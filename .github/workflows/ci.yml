name: ModelOps CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-quality:
    name: Backend Quality & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Python Syntax & Static Analysis
        run: |
          python -m py_compile $(find backend/app -name "*.py")

      - name: Run Unit & Integration Test Suite
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite:///test_ci.db
          MLFLOW_ALLOW_FILE_STORE: 'true'
          MLFLOW_DISABLE_AGENT_HINT: '1'
        run: |
          pytest -v tests/

  frontend-quality:
    name: Frontend TypeScript Verification & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: TypeScript Compile & Production Bundle
        working-directory: ./frontend
        run: npm run build

  docker-validation:
    name: Docker Configuration & Compose Verification
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          docker compose config --quiet
